# The build must not eat the host: three cores and three gigabytes are shared with the
# assistant that is being built for. Small heap, one worker, no daemon, no Kotlin daemon
# and no parallel module graph — slower on purpose.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
